# GenClass telemetry collector (Cloudflare Worker + R2).
# Deploy: npx --yes wrangler@4 deploy   (from this directory)
name = "genclass-telemetry"
main = "src/index.ts"
compatibility_date = "2026-09-01"
account_id = "144bd5f5270b51dbe7faf46227a154f0"
workers_dev = true
# Never log request contents: no observability/logpush of request bodies or headers.
logpush = false

[observability]
enabled = false

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "genclass-telemetry"

# Per-client batch limit: 60 batches per minute per IP (the runtime sends at most one batch every 10 s per page).
[[ratelimits]]
name = "LIMIT"
namespace_id = "4802"
simple = { limit = 60, period = 60 }
